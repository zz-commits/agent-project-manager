[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-project-manager"
version = "0.1.0"
description = "Deterministic project facts and handoffs for coding agents"
requires-python = ">=3.12"
dependencies = ["ruamel.yaml>=0.18,<0.19", "jsonschema[format]>=4.23,<5", "filelock>=3.16,<4"]

[project.scripts]
apm = "apm.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/schemas", "/docs", "/skills", "/evals", "/tests", "/examples", "/cli", "/README.md", "/AGENTS.md", "/pyproject.toml", "/uv.lock", "/.python-version", "/.gitignore", "/.gitattributes"]

[tool.hatch.build.targets.wheel]
packages = ["src/apm"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/v1" = "apm/schemas/v1"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
